name: Build and Push Docker Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p require('./package.json').version)" >> "$GITHUB_OUTPUT"

      # arm64 镜像在 amd64 runner 上通过 QEMU 模拟构建
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # 标签:<package.json 的 version> 和 latest
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ua-parser-server:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ua-parser-server:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
